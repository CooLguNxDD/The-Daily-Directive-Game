; Onboarding steps (advisor a-7): rows in order; Id names the completion check in DCHUD (Move, Shoot, Strike, Raise,
; Snap, Objective, Extract, Clash). {SPRINT} {JUMP} {CROUCH} {RELOAD} show the player's saved keys.
; R25 tutorial (human 2026-11-15): the "How to play" page (main menu, offered before the first run) and one-time hint cards.
; A +Hints Id is a trigger of the DCHints registry (FirstEnemy, LowAmmo, StrikeReady, Draft, Downed, Objective, Extract).
+HowToPlay=(Title="CONTROLS",Lines=("WASD move, SHIFT sprint, SPACE jump, CTRL crouch, E use and revive.","1 weapons: LMB shoot, hold RMB to aim over the shoulder, R reload, Q or the wheel picks the next gun.","2 strikes: aim at a tower, LMB calls the strike. Q picks another, like the SUPPLY DROP crate (ammo, film, health).","3 camera: hold RMB to raise the viewfinder, LMB snaps the photo."))
+HowToPlay=(Title="YOUR SECTOR",Lines=("HQ wants front pages: photograph the destruction to earn propaganda points.","Best shot: 0.2 to 0.8 seconds after the flash. Danger and factions clashing pay more.","Follow the yellow diamond for HQ orders, then reach the beacon to extract.","Down: hold E to get up, or a crewmate revives you. Bleed out and the crew spends a life: you REDEPLOY by drop pod."))
+HowToPlay=(Title="CARDS",Lines=("Between sectors HQ deals three cards: pick one.","Strikes unlock new bombs, gear changes your camera, mutators change the whole city.","Rare and epic cards glow brighter: drones, turrets and support squads.","Sentry and drone cards sit in the strike list (2, Q): aim, click. Passive cards: icons under HQ orders."))
+Hints=(Id="FirstEnemy",Title="Hostiles",Text="Units of a hostile faction close in. 1 for the rifle, LMB to shoot. Factions also fight each other: photograph the clash.",Seconds=8)
+Hints=(Id="Objective",Title="HQ orders",Text="Follow the yellow diamond. Finish the order, then reach the beacon to extract early.",Seconds=8)
+Hints=(Id="StrikeReady",Title="Strike ready",Text="2 for the strike, aim at a tower and LMB. Then 3, raise the camera with RMB and snap the collapse.",Seconds=8)
+Hints=(Id="LowAmmo",Title="Low ammo",Text="Call a supply drop from the strike list (2, then Q) or switch weapons with Q.",Seconds=7)
+Hints=(Id="Downed",Title="Down",Text="Hold E to get back up. A crewmate nearby can revive you faster.",Seconds=7)
+Hints=(Id="Extract",Title="Extract",Text="Order done: reach the yellow beacon to end the sector early.",Seconds=7)
+Hints=(Id="Draft",Title="Requisition",Text="Click one card. Rarer cards glow brighter.",Seconds=7)
