; Post-process layer stack (R19). Additive: Bloom, Exposure (stops), Vignette, Grain, Outline. Multiplicative: Saturation,
; Contrast, Gain. Code only sets weights by Id (Flash = bloom peak x decay, Viewfinder while the camera is up, Damage
; after a hit, Sector<N> for the sector look, Photo* for the photo capture). Order = Priority.
