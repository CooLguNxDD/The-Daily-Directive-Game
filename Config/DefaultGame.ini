; R26 internet co-op over EOS P2P (DCOnline.h). The switch: off hides HOST ONLINE / JOIN BY CODE and nothing online
; loads. On: still nothing online starts until a player presses one of them; credentials come from the gitignored
; Config/Custom/EOS.ini (tools/eos/stage_eos_ini.sh), and any failure falls back to the LAN/IP path with a message.
[/Script/Epic_AI_Mega_Jam2.DCOnlineSettings]
bEnabled=True
Transport=EOS
TransportModule=DCOnlineEos
CredentialsFile=Custom/EOS.ini
CodeAlphabet=ABCDEFGHJKLMNPQRSTUVWXYZ23456789
CodeLength=6
BucketId=DirectorsCut:Coop
DeviceModel=DirectorsCut PC
DisplayName=Photographer
TimeoutSeconds=30
Messages=(("Off", "ONLINE PLAY IS OFF. HOSTING ON YOUR NETWORK INSTEAD."),("NoCredentials", "ONLINE PLAY IS NOT SET UP ({0} MISSING). USING YOUR NETWORK (LAN / IP) INSTEAD."),("LoginFailed", "ONLINE LOGIN FAILED ({0}). USING YOUR NETWORK (LAN / IP) INSTEAD."),("Timeout", "ONLINE SERVICE DID NOT ANSWER IN TIME. USING YOUR NETWORK (LAN / IP) INSTEAD."),("ListenFailed", "COULD NOT HOST ONLINE ({0}). HOSTING ON YOUR NETWORK INSTEAD."),("AdvertiseFailed", "COULD NOT PUBLISH THE JOIN CODE ({0}). HOSTING ON YOUR NETWORK INSTEAD."),("NotFound", "NO GAME FOUND FOR CODE {0}. CHECK THE CODE, OR JOIN BY IP BELOW."),("ConnectFailed", "LOST THE ONLINE CONNECTION ({0}). JOIN BY IP OR TRY THE CODE AGAIN."),("BadCode", "A JOIN CODE IS {0} LETTERS AND DIGITS."),("LoggingIn", "CONNECTING TO THE ONLINE SERVICE..."),("Opening", "OPENING THE ONLINE LOBBY..."),("Advertising", "PUBLISHING THE JOIN CODE..."),("Searching", "LOOKING FOR GAME {0}..."),("Connecting", "JOINING GAME {0}..."),("Hosting", "ONLINE. FRIENDS JOIN WITH CODE  {0}"))
