; Front page body copy (critic CP6): real sentences under each column.
+FrontPageCopy="HQ confirms the operation went exactly to plan, and that the plan was revised afterwards to match."
+FrontPageCopy="Residents report the skyline is now much easier to photograph, especially the parts that are no longer there."
+FrontPageCopy="{PLAYER} filed the pictures from very close, against advice, and was praised for initiative."
+FrontPageCopy="Officials stress that every tower was condemned in advance, in triplicate, by a committee of one."
+FrontPageCopy="The orbital battery fired on schedule; the schedule has been reprinted to show the new time."
+FrontPageCopy="Swarmers were seen leaving the area at speed. HQ describes this as a strategic success for photography."
+FrontPageCopy="Readers are reminded that dust is temporary, while a good front page is forever."
+FrontPageCopy="A spokesman thanked the city for its patience and its masonry."
+FrontPageCopy="Our darkroom worked through the night. The darkroom would like a word."
+FrontPageCopy="Insurance claims will be processed in the order the paperwork survives."
+FrontPageCopy="Witnesses describe a flash, a roar and then a photographer asking everyone to hold still."
+FrontPageCopy="Tomorrow's weather: clear skies, light ash, scattered orbital activity in the afternoon."

