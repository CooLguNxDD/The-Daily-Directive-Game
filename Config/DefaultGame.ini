; Front page body copy (critic CP6): real sentences under each column.
+FrontPageCopy="HQ confirms the operation went exactly to plan, and that the plan was revised afterwards to match."
+FrontPageCopy="Residents report the skyline is now much easier to photograph, especially the parts that are no longer there."
+FrontPageCopy="{PLAYER} filed the pictures from very close, against advice, and was praised for initiative."
+FrontPageCopy="Officials stress that every tower was condemned in advance, in triplicate, by a committee of one."
+FrontPageCopy="The orbital battery fired on schedule; the schedule has been reprinted to show the new time."
+FrontPageCopy="Swarmers were seen leaving the area at speed. HQ describes this as a strategic success for photography."
+FrontPageCopy="Readers are reminded that dust is temporary, while a good front page is forever."
+FrontPageCopy="A spokesman thanked the city for its patience and its masonry."
+FrontPageCopy="Our darkroom worked through the night. The darkroom would like a word."
+FrontPageCopy="Insurance claims will be processed in the order the paperwork survives."
+FrontPageCopy="Witnesses describe a flash, a roar and then a photographer asking everyone to hold still."
+FrontPageCopy="Tomorrow's weather: clear skies, light ash, scattered orbital activity in the afternoon."
+FrontPageCopy="The Ministry of Urban Renewal reports record progress and has asked for a larger building to report it from."
+FrontPageCopy="Commuters are advised to allow extra time, and to check that their office is still there before setting out."
+FrontPageCopy="A local baker says business is booming, though he would prefer the word were used less literally."
+FrontPageCopy="{PLAYER} declined to comment, citing ringing in both ears and a deadline."
+FrontPageCopy="The city council met in emergency session in the only room with four walls."
+FrontPageCopy="Property values in the district are expected to rise once there is property again."
+FrontPageCopy="Our photo desk thanks the crew for keeping the lens cap off and the shutter honest."
+FrontPageCopy="Pigeons have relocated to the suburbs and are said to be adjusting well."
+FrontPageCopy="HQ denies any connection between the strike schedule and the weekly circulation figures."
+FrontPageCopy="Street vendors have begun selling commemorative rubble, pre-dusted for authenticity."
+FrontPageCopy="A noise complaint was filed, then the office it was filed with was also struck."
+FrontPageCopy="Engineers describe the new skyline as bold, open-plan and mostly horizontal."
+FrontPageCopy="The neon district reports its signs still work, even where the walls behind them do not."
+FrontPageCopy="An unnamed official praised the operation's precision, then asked which tower it had been aimed at."
+FrontPageCopy="Night shift workers say the glow on the horizon is either dawn or the industrial quarter."
+FrontPageCopy="The museum of civic architecture is temporarily closed for being an exhibit."
+FrontPageCopy="Factions fighting in the old market were asked to keep it down; they did, one floor at a time."
+FrontPageCopy="Readers who lost a tower this week may claim a free subscription, delivered to the nearest standing door."
+FrontPageCopy="The transit authority confirms the line is running, though the line is now a ramp."
+FrontPageCopy="HQ reminds all units that a blurred photograph is a waste of a perfectly good explosion."
+FrontPageCopy="Sources close to the rubble say morale is high and the dust is higher."
+FrontPageCopy="The crossword returns next week, once the editors find the letters that fell out of the sign."
+FrontPageCopy="Local machines were seen queueing for repairs at a workshop that has since become a courtyard."
+FrontPageCopy="Our correspondent asked the Hive for a statement; the Hive replied in large numbers."
+FrontPageCopy="Restaurants on the main street are now open air, by popular demand of gravity."
+FrontPageCopy="The parade route has been simplified to a straight line through what used to be the bank."
+FrontPageCopy="A senior officer called the campaign a triumph of planning; the planners have not been located."
+FrontPageCopy="Zoning disputes in the north district were settled overnight, permanently."
+FrontPageCopy="The orbital battery's crew sends regards and asks for photographs of their work for the canteen wall."
+FrontPageCopy="Residents are thanked for leaving the lights on, which made the targets so much easier to see."
+FrontPageCopy="The editor apologises for yesterday's late edition; the printing press was briefly airborne."
+FrontPageCopy="HQ has ordered more film, more satellites and fewer questions."
+FrontPageCopy="Every tower that fell this week did so in focus, which the photo desk considers a personal best."
+FrontPageCopy="A scavenger convoy was spotted carrying away a staircase. Police are looking for the rest of the building."
+FrontPageCopy="Tonight's forecast: rain, then neon, then sirens, then rain again."
+FrontPageCopy="Letters to the editor may be left at the crater beside the old post office."
;R27 reel camera sequence (human 14:30): each clip cuts through these angles in order; Weight = share of the clip,
;BlendFraction = quick blend in (0 = hard cut). Anchor (human 14:55) = what every angle looks at: the clip's blast; distance
;scales with the blast radius (RadiusScale). Overview = the -dccollapsecam high angled direction (offset -4200,-4200,6500).
+ReelCameraShots=(Kind="Orbit",Anchor="Blast",Weight=1.1,DistanceCm=1800,RadiusScale=2.0,HeightCm=450,LookUpCm=120,SweepDeg=40,Fov=70)
+ReelCameraShots=(Kind="Overview",Anchor="Blast",Weight=1.0,BlendFraction=0,Offset=(X=-4200,Y=-4200,Z=6500),DistanceCm=6000,RadiusScale=5,LookUpCm=150,Fov=60)
+ReelCameraShots=(Kind="LowHero",Anchor="Blast",Weight=0.8,BlendFraction=0.06,DistanceCm=320,HeightCm=10,LookUpCm=250,SweepDeg=-8,Fov=62)
+ReelCameraShots=(Kind="SideTrack",Anchor="Blast",Weight=1.0,DistanceCm=1500,RadiusScale=2.5,HeightCm=250,LookUpCm=60,SweepDeg=10,Fov=55)
