; R13 sound queue (human 2026-11-14): every play is queued and flushed once per frame. Same cue near the same spot within
; MergeWindowSeconds merges into one louder play; per class a voice budget (MaxVoices) and a start budget per frame
; (StartsPerFrame); over budget a request waits MaxWaitFrames, then drops (DCAUDIO drop). Priority >= ProtectedPriority
